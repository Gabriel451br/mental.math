<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#3B82F6" />
  <title>Treino para Concursos</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Treino" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F7F8FA; color: #1A1D23; min-height: 100vh;
      -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 560px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    .app-header { margin-bottom: 1.2rem; }
    .app-title  { font-size: 22px; font-weight: 700; }
    .app-sub    { font-size: 13px; color: #9CA3AF; margin-top: 2px; }

    .subjects { display: flex; flex-direction: column; gap: 14px; }
    .subject-card {
      display: flex; align-items: center; gap: 16px; padding: 18px 16px; width: 100%; text-align: left;
      border: 2px solid; border-bottom-width: 6px; border-radius: 20px; cursor: pointer;
      font-family: inherit; color: inherit; transition: transform .08s;
    }
    .subject-card:active { transform: translateY(3px); border-bottom-width: 3px; }
    .subject-card .big-icon { font-size: 40px; width: 64px; height: 64px; border-radius: 16px; background: #fff;
      display: flex; align-items: center; justify-content: center; flex: none; }
    .subject-card .s-body { flex: 1; }
    .subject-card .s-title { font-size: 18px; font-weight: 800; }
    .subject-card .s-desc { font-size: 12px; color: #4B5563; margin-top: 4px; line-height: 1.4; }
    .subject-card .s-meta { font-size: 11px; font-weight: 700; margin-top: 8px; }
    .back { font-size: 13px; color: #6B7280; background: none; border: none; padding: 0; margin-bottom: 10px;
      cursor: pointer; font-family: inherit; }
    .view { display: none; }
    .view.active { display: block; }

    .games { display: flex; flex-direction: column; gap: 10px; }
    .game {
      display: flex; align-items: center; gap: 14px; padding: 14px;
      background: #fff; border: 2px solid #E8EAF0; border-bottom-width: 5px; border-radius: 16px;
      text-decoration: none; color: inherit; transition: transform .08s;
    }
    .game:active { transform: translateY(2px); }
    .game-icon {
      width: 52px; height: 52px; border-radius: 14px; flex: none;
      display: flex; align-items: center; justify-content: center; font-size: 26px;
    }
    .game-body { flex: 1; }
    .game-title { font-size: 16px; font-weight: 700; }
    .game-desc  { font-size: 12px; color: #6B7280; margin-top: 3px; line-height: 1.4; }
    .game-meta  { font-size: 11px; color: #9CA3AF; margin-top: 5px; }
    .game-meta:empty { display: none; }
    .tag {
      font-size: 10px; font-weight: 800; letter-spacing: .5px; padding: 2px 6px; border-radius: 5px;
      background: #DCFCE7; color: #15803D; vertical-align: middle; margin-left: 4px;
    }
    .game.soon { opacity: .55; pointer-events: none; border-bottom-width: 2px; padding: 10px 14px; }
    .game.soon .game-icon { width: 40px; height: 40px; font-size: 20px; }
    .game.soon .tag { background: #F3F4F6; color: #6B7280; }
    .arrow { font-size: 20px; color: #D1D5DB; }
  </style>
</head>
<body>
  <div class="container">
    <div class="view" id="view-home">
      <div class="app-header">
        <div class="app-title">Treino para Concursos</div>
        <div class="app-sub">Escolha uma matéria para começar</div>
      </div>
      <div class="subjects" id="subjects"></div>
    </div>

    <div class="view" id="view-subject">
      <button class="back" onclick="location.hash = ''">← Matérias</button>
      <div class="app-header">
        <div class="app-title" id="subject-title"></div>
        <div class="app-sub" id="subject-sub"></div>
      </div>
      <div class="games" id="subject-games"></div>
    </div>
  </div>

  <script>
    /* ════════════════════════════════════════════
       MATÉRIAS E JOGOS
       Para adicionar um jogo, inclua-o na matéria certa.
       store = chave do localStorage com o progresso (jogos estilo trilha)
    ════════════════════════════════════════════ */
    const SUBJECTS = [
      {
        id: "rlm", name: "Raciocínio Lógico-Matemático", short: "RLM", icon: "🧮",
        bg: "#EFF6FF", border: "#BFDBFE", color: "#1D4ED8",
        desc: "Cálculo mental, lógica proposicional e mais.",
        games: [
          { title: "Matemática Mental", icon: "⚡", bg: "#EFF6FF", href: "matematica.html", store: "matematica-v1",
            desc: "Trilha de técnicas para calcular de cabeça (somar, subtrair, multiplicar, dividir, %, potências) e treino cronometrado." },
          { title: "Lógica Proposicional", icon: "🧠", bg: "#F5F3FF", href: "logica.html", store: "logica-v1",
            desc: "Proposições, conectivos, negações, equivalências, tabela-verdade e deduções." },
          { title: "Lógica de Argumentação", icon: "🗂️", bg: "#FDF2F8", soon: true },
          { title: "Matemática Financeira", icon: "💰", bg: "#ECFDF5", soon: true },
        ],
      },
      {
        id: "portugues", name: "Língua Portuguesa", short: "Português", icon: "📚",
        bg: "#ECFDF5", border: "#A7F3D0", color: "#047857",
        desc: "Fonologia, divisão silábica, acentuação e mais.",
        games: [
          { title: "Fonologia e Acentuação", icon: "✍️", bg: "#ECFDF5", href: "portugues.html", store: "portugues-fonologia-v1",
            desc: "Fonemas, encontros vocálicos, divisão silábica, sílaba tônica, oxítonas/paroxítonas/proparoxítonas e acentuação." },
          { title: "Crase", icon: "🔀", bg: "#FFFBEB", soon: true },
          { title: "Classes de palavras", icon: "🏷️", bg: "#FEF2F2", soon: true },
        ],
      },
      {
        id: "constitucional", name: "Direito Constitucional", short: "Constitucional", icon: "⚖️",
        bg: "#FFFBEB", border: "#FDE68A", color: "#B45309",
        desc: "Constituição Federal: trilha, treino e lei seca.",
        games: [
          { title: "Constituição Federal", icon: "📜", bg: "#FFFBEB", href: "constitucional.html", store: "constitucional-v1",
            desc: "Teoria, princípios fundamentais, direitos e garantias, nacionalidade, direitos políticos, organização do Estado e Administração Pública — com lei seca em flashcards e exercícios." },
          { title: "Organização dos Poderes", icon: "🏛️", bg: "#EEF2FF", soon: true },
          { title: "Controle de constitucionalidade", icon: "⚖️", bg: "#FEF2F2", soon: true },
        ],
      },
      {
        id: "administrativo", name: "Direito Administrativo", short: "Administrativo", icon: "🏛️",
        bg: "#F0FDFA", border: "#99F6E4", color: "#0F766E",
        desc: "Princípios, atos, poderes, licitações e mais.",
        games: [
          { title: "Administração Pública", icon: "📑", bg: "#F0FDFA", href: "administrativo.html", store: "administrativo-v1", isNew: true,
            desc: "Princípios, organização, poderes, atos, agentes públicos, licitações, responsabilidade do Estado, improbidade e processo administrativo — com lei seca em flashcards e exercícios." },
          { title: "Serviços públicos e concessões", icon: "🚌", bg: "#EEF2FF", soon: true },
          { title: "Controle da Administração", icon: "🔎", bg: "#FEF2F2", soon: true },
        ],
      },
    ];

    function loadStore(key) {
      try { return JSON.parse(localStorage.getItem(key)) || null; } catch (e) { return null; }
    }
    function progressText(key) {
      const p = loadStore(key);
      return p && p.xp ? `⚡ ${p.xp} XP · 🔥 ${p.streak.count} dia(s)` : "";
    }
    const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;

    function gameCard(g) {
      return g.soon ? `
        <div class="game soon">
          <div class="game-icon" style="background:${g.bg}">${g.icon}</div>
          <div class="game-body"><div class="game-title">${g.title} <span class="tag">EM BREVE</span></div></div>
        </div>` : `
        <a class="game" href="${g.href}">
          <div class="game-icon" style="background:${g.bg}">${g.icon}</div>
          <div class="game-body">
            <div class="game-title">${g.title}${g.isNew ? ' <span class="tag">NOVO</span>' : ""}</div>
            <div class="game-desc">${g.desc}</div>
            <div class="game-meta">${g.store ? progressText(g.store) : ""}</div>
          </div>
          <div class="arrow">›</div>
        </a>`;
    }

    function renderHome() {
      document.getElementById("subjects").innerHTML = SUBJECTS.map(s => {
        const live = s.games.filter(g => !g.soon);
        const xp = live.reduce((t, g) => t + ((g.store && loadStore(g.store)) || { xp: 0 }).xp, 0);
        return `
          <button class="subject-card" style="background:${s.bg};border-color:${s.border}" onclick="location.hash='${s.id}'">
            <span class="big-icon">${s.icon}</span>
            <span class="s-body">
              <span class="s-title" style="color:${s.color};display:block">${s.name}</span>
              <span class="s-desc" style="display:block">${s.desc}</span>
              <span class="s-meta" style="color:${s.color};display:block">${plural(live.length, "tópico", "tópicos")}${xp ? ` · ⚡ ${xp} XP` : ""}</span>
            </span>
            <span class="arrow">›</span>
          </button>`;
      }).join("");
    }

    function renderSubject(s) {
      const live = s.games.filter(g => !g.soon).length;
      document.getElementById("subject-title").textContent = `${s.icon} ${s.name}`;
      document.getElementById("subject-sub").textContent = plural(live, "tópico disponível", "tópicos disponíveis");
      document.getElementById("subject-games").innerHTML = s.games.map(gameCard).join("");
    }

    // navegação por #hash: o botão "voltar" do celular funciona
    function route() {
      const s = SUBJECTS.find(x => x.id === location.hash.slice(1));
      document.getElementById("view-home").classList.toggle("active", !s);
      document.getElementById("view-subject").classList.toggle("active", !!s);
      if (s) renderSubject(s); else renderHome();
      window.scrollTo(0, 0);
    }
    window.addEventListener("hashchange", route);
    route();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
